# Prüft bei jedem Push, ob index.html valides HTML ist (W3C-Validator "vnu").
name: HTML-Prüfung

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      # Aktueller W3C-Validator als npm-Paket (feste Version, gleich wie validator.w3.org).
      # Das frühere Paket html5validator 0.4.2 enthält einen Validator von 2020, der neuere
      # HTML-Regeln noch nicht kennt. Java ist auf dem Runner vorinstalliert.
      - name: Validator installieren
        run: npm install --no-save vnu-jar@26.11.4

      - name: index.html prüfen
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only index.html
